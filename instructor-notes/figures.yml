- id: IF-01-0-B
  unit: chapter-01-role-of-analytics
  file: 00-chapter-notes.md
  kind: diagram
  purpose: A decision aid for sorting a question into one of the four types of analytics.
  shows: A vertical flow of four yes/no questions, asked from the most demanding type down so that a mixed question takes
    the highest type it asks for (does the answer recommend what to do under constraints, does it project what might happen,
    does it explain why it happened, does it summarize what happened). Each yes leads to a type label with one Charles River
    example question and the kind of evidence the answer needs (a recommendation with its constraints, an expectation or forecast,
    a decomposition or trace, a summary). A no on the last question leads to a box that says to reword the question. A side
    note says that most real questions combine two types.
