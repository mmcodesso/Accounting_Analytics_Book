- id: IF-03-0-B
  unit: chapter-03-accounting-data-environment
  file: 00-chapter-notes.md
  kind: diagram
  purpose: A decision tree that sorts a column into primary key, foreign key, bridge key or the source-document trace.
  shows: A vertical tree of four yes-or-no questions. Does the column identify the rows of its own table? Yes leads to primary
    key, with SalesOrderID in SalesOrder as the example. Does it hold the key values of another table? Yes leads to foreign
    key, with CustomerID in SalesOrder, and a side branch asks whether the same column reaches into another table group, which
    makes it a bridge key, with ItemID in SalesOrderLine. Does the meaning of its value depend on another column? Yes leads
    to a logical reference, not a key, with SourceDocumentID in GLEntry read together with SourceDocumentType. Each leaf shows
    its example as a small table header (the logical reference shows SourceDocumentType and SourceDocumentID together), and
    the leaf for the logical reference is drawn with the dashed amber style that the chapter's diagrams use for the trace.
    A column that none of the questions fits is an ordinary column.
  data: The examples named in the chapter (SalesOrder, SalesOrderLine, GLEntry); no counts.
  status: built
