<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" role="img" aria-labelledby="title desc">
<title id="title">Furniture margin bridge</title>
<desc id="desc">Promotions reduce margin, with smaller offsetting effects. Exact amounts are in the native effect table.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<text x="30" y="45" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">Furniture margin bridge at standard cost</text>
<rect x="75" y="136.308" width="125" height="298.692" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="1"/>
<text x="137" y="121.308" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">$1810.3k</text>
<text x="137" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Q3</text>
<path d="M200,136.308 L248,136.308" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="248" y="135.006" width="125" height="2" rx="0" fill="#117A65" stroke="#117A65" stroke-width="1"/>
<text x="310" y="120.006" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">+7.9k</text>
<text x="310" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Volume</text>
<path d="M373,135.006 L421,135.006" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="421" y="135.006" width="125" height="2" rx="0" fill="#B03A2E" stroke="#B03A2E" stroke-width="1"/>
<text x="483" y="120.006" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">-3.3k</text>
<text x="483" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Mix</text>
<path d="M546,135.554 L594,135.554" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="594" y="135.377" width="125" height="2" rx="0" fill="#117A65" stroke="#117A65" stroke-width="1"/>
<text x="656" y="120.377" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">+1.1k</text>
<text x="656" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Price lists</text>
<path d="M719,135.377 L767,135.377" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="767" y="135.377" width="125" height="19.9134" rx="0" fill="#B03A2E" stroke="#B03A2E" stroke-width="1"/>
<text x="829" y="120.377" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">-120.7k</text>
<text x="829" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Promotions</text>
<path d="M892,155.29 L940,155.29" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="940" y="155.29" width="125" height="2" rx="0" fill="#117A65" stroke="#117A65" stroke-width="1"/>
<text x="1002" y="140.29" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">+0.0k</text>
<text x="1002" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Cost</text>
<path d="M1065,155.29 L1113,155.29" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<rect x="1113" y="155.29" width="125" height="279.71" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="1"/>
<text x="1175" y="140.29" font-size="28" fill="#2C3E50" font-weight="normal" text-anchor="middle">$1695.2k</text>
<text x="1175" y="481" font-size="28" fill="#5D6D7E" font-weight="normal" text-anchor="middle">Q4</text>
<text x="30" y="552" font-size="30" fill="#2C3E50" font-weight="normal" text-anchor="start">Each effect reconciles Q3 margin dollars to Q4. Cost is constant by construction.</text>
