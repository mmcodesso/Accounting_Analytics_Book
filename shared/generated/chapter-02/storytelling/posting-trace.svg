<text x="468" y="252" font-size="29" fill="#2C3E50" font-weight="normal" text-anchor="start">SalesInvoiceID  7947</text>
<path d="M850,220 L880,220" fill="none" stroke="#117A65" stroke-width="3"/>
<rect x="880" y="90" width="400" height="260" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
