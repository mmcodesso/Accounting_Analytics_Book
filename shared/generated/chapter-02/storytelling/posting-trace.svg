<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 495" width="1280" height="495" role="img" aria-labelledby="title desc">
<title id="title">One invoice-line posting: trace direction</title>
<desc id="desc">Focused adaptation of Figure 1.6. SalesInvoice 7947 contains SalesInvoiceLine 10645. GLEntry 126312 identifies that document and line. The first direction tests for expected postings; the reverse locates support. A single match cannot establish population completeness.</desc>
