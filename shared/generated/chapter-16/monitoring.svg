<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">A repeatable monitoring cycle</title>
<desc id="desc">Define the rule, validate the population, retain failed document-test pairs, review evidence, and revise the rule or control.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<defs><marker id="filter-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#117A65"/></marker></defs>
<rect x="30" y="35" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="35" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="46" y="73" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Rule</text>
<text x="46" y="129" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Population and threshold</text>
<rect x="830" y="35" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="830" y="35" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="846" y="73" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Population</text>
<text x="846" y="129" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Completeness and coverage</text>
<rect x="830" y="320" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="830" y="320" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="846" y="358" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Exceptions</text>
<text x="846" y="414" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Document + test</text>
<rect x="30" y="320" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="320" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="46" y="358" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Disposition</text>
<text x="46" y="414" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Evidence and follow-up</text>
<path d="M456 115 L816 115" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<path d="M1040 201 L1040 306" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<path d="M824 400 L464 400" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<path d="M240 314 L240 209" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
</g>
</svg>
