<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="title desc">
<title id="title">An exact lookup through SalesInvoiceID</title>
<desc id="desc">Invoice line 10645 has invoice key 7947. The matching invoice returns date 2025-03-05.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<text x="30" y="48" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">Lookup value, matching key, return value</text>
<rect x="30" y="115" width="500" height="235" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="115" width="500" height="62" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="50" y="157" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="start">SalesInvoiceLine</text>
<text x="50" y="228" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Line ID: 10645</text>
<text x="50" y="290" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">SalesInvoiceID: 7947</text>
<rect x="740" y="115" width="500" height="235" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="740" y="115" width="500" height="62" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="760" y="157" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="start">SalesInvoice</text>
<text x="760" y="228" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">SalesInvoiceID: 7947</text>
<text x="760" y="290" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">InvoiceDate: 2025-03-05</text>
<path d="M532,285 L738,222" fill="none" stroke="#5D6D7E" stroke-width="3"/>
<text x="625" y="184" font-size="29" fill="#117A65" font-weight="normal" text-anchor="middle">exact match</text>
<text x="30" y="432" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Return the invoice date to the line. The number of lines stays the same.</text>
</g>
</svg>
