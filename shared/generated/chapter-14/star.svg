<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 585" width="1280" height="585" role="img" aria-labelledby="title desc">
<title id="title">The sales star after merging the invoice header</title>
<desc id="desc">Customer, Item, and a complete Date table each filter SalesInvoiceLine directly. Every arrow is one to many and single direction.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<defs><marker id="filter-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#117A65"/></marker></defs>
<rect x="30" y="15" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="15" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="46" y="53" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Customer</text>
<text x="46" y="109" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">CustomerID</text>
<text x="46" y="153" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">CustomerSegment</text>
<rect x="30" y="205" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="205" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="46" y="243" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Item</text>
<text x="46" y="299" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">ItemID</text>
<text x="46" y="343" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">ItemGroup</text>
<rect x="30" y="395" width="420" height="160" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="30" y="395" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="46" y="433" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">Date</text>
<text x="46" y="489" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Date</text>
<text x="46" y="533" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">Year / YearMonth</text>
<rect x="830" y="150" width="420" height="300" rx="0" fill="#FFFFFF" stroke="#CAD3DA" stroke-width="2"/>
<rect x="830" y="150" width="420" height="54" rx="0" fill="#1A5276" stroke="#1A5276" stroke-width="2"/>
<text x="846" y="188" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="start">SalesInvoiceLine</text>
<text x="846" y="254" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">CustomerID</text>
<text x="846" y="324" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">ItemID</text>
<text x="846" y="394" font-size="31" fill="#2C3E50" font-weight="normal" text-anchor="start">InvoiceDate</text>
<path d="M456 95 L816 244" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<text x="476" y="80" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">1</text>
<text x="760" y="205.822" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">*</text>
<path d="M456 285 L816 314" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<text x="476" y="270" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">1</text>
<text x="760" y="294.489" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">*</text>
<path d="M456 475 L816 384" stroke="#117A65" stroke-width="4" fill="none" marker-end="url(#filter-arrow)"/>
<text x="476" y="460" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">1</text>
<text x="760" y="383.156" font-size="32" fill="#2C3E50" font-weight="bold" text-anchor="start">*</text>
</g>
</svg>
