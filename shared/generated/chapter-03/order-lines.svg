<title id="title">Orders, items and order lines</title>
<desc id="desc">Two parent tables connect to a junction table. SalesOrder to SalesOrderLine: exactly one at parent and one or many at child. Item to SalesOrderLine: exactly one at parent and zero or many at child.</desc>
