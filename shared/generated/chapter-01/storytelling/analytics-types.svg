<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="title desc">
<title id="title">Four types of analytics</title>
<desc id="desc">Figure 1.1, with teaching-sized labels.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<rect x="15" y="90" width="302" height="235" rx="10" fill="#EAF2F8" stroke="#CAD3DA" stroke-width="2"/>
<text x="30" y="135" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Descriptive</text>
<text x="30" y="171" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Analytics</text>
<text x="30" y="245" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">What happened?</text>
<rect x="333" y="90" width="302" height="235" rx="10" fill="#EAF2F8" stroke="#CAD3DA" stroke-width="2"/>
<text x="348" y="135" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Diagnostic</text>
<text x="348" y="171" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Analytics</text>
<text x="348" y="245" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Why did it</text>
<text x="348" y="287" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">happen?</text>
<rect x="651" y="90" width="302" height="235" rx="10" fill="#EAF2F8" stroke="#CAD3DA" stroke-width="2"/>
<text x="666" y="135" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Predictive</text>
<text x="666" y="171" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Analytics</text>
<text x="666" y="245" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">What might</text>
<text x="666" y="287" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">happen?</text>
<rect x="969" y="90" width="302" height="235" rx="10" fill="#EAF2F8" stroke="#CAD3DA" stroke-width="2"/>
<text x="984" y="135" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Prescriptive</text>
<text x="984" y="171" font-size="32" fill="#1A5276" font-weight="bold" text-anchor="start">Analytics</text>
<text x="984" y="245" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">What should we</text>
<text x="984" y="287" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">do?</text>
<text x="15" y="405" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">A single investigation can ask several kinds of question.</text>
</g>
</svg>
