<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">Order-to-Cash goods process</title>
<desc id="desc">Adapted from Figure 1.5. The goods sequence does not describe every service invoice.</desc>
