<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
<title id="title">Trace one revenue posting to its source</title>
<desc id="desc">GLEntry 126312 is a revenue credit of $688.42. The source fields identify SalesInvoice 7947 and line 10645, with quantity 2 at $344.21 each. This is one posting, not the complete journal entry.</desc>
