<text x="480" y="327" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">for this posting</text>
<rect x="890" y="90" width="360" height="280" rx="10" fill="#EAF2F8" stroke="#1A5276" stroke-width="2"/>
