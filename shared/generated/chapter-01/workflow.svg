<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="title desc">
<title id="title">The accounting analytics workflow</title>
<desc id="desc">Six stages read clockwise: define the question, access the data, prepare and clean, analyze, visualize and present, and communicate findings. Each stage feeds the next.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<rect x="30" y="26" width="360" height="220" rx="10" fill="#EAF2F8" stroke="#1A5276" stroke-width="2"/>
<text x="50" y="70" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">1. Define</text>
<text x="50" y="129" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Frame a specific</text>
<text x="50" y="173" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">business question.</text>
<rect x="460" y="26" width="360" height="220" rx="10" fill="#EAF2F8" stroke="#1A5276" stroke-width="2"/>
<text x="480" y="70" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">2. Access</text>
<text x="480" y="129" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Choose relevant</text>
<text x="480" y="173" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">tables and columns.</text>
<rect x="890" y="26" width="360" height="220" rx="10" fill="#EAF2F8" stroke="#1A5276" stroke-width="2"/>
<text x="910" y="70" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">3. Prepare</text>
<text x="910" y="129" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Fix missing values,</text>
<text x="910" y="173" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">duplicates, formats.</text>
<rect x="890" y="330" width="360" height="220" rx="10" fill="#E8F6F3" stroke="#117A65" stroke-width="2"/>
<text x="910" y="374" font-size="34" fill="#117A65" font-weight="bold" text-anchor="start">4. Analyze</text>
<text x="910" y="433" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Summarize, compare,</text>
<text x="910" y="477" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">model, find anomalies.</text>
<rect x="460" y="330" width="360" height="220" rx="10" fill="#E8F6F3" stroke="#117A65" stroke-width="2"/>
<text x="480" y="374" font-size="34" fill="#117A65" font-weight="bold" text-anchor="start">5. Visualize</text>
<text x="480" y="433" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Make evidence clear</text>
<text x="480" y="477" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">for stakeholders.</text>
<rect x="30" y="330" width="360" height="220" rx="10" fill="#E8F6F3" stroke="#117A65" stroke-width="2"/>
<text x="50" y="374" font-size="34" fill="#117A65" font-weight="bold" text-anchor="start">6. Communicate</text>
<text x="50" y="433" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">Explain findings to</text>
<text x="50" y="477" font-size="32" fill="#2C3E50" font-weight="normal" text-anchor="start">decision makers.</text>
<path d="M394,136 L446,136" fill="none" stroke="#5D6D7E" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M824,136 L876,136" fill="none" stroke="#5D6D7E" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1070,252 L1070,310" fill="none" stroke="#5D6D7E" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M884,440 L832,440" fill="none" stroke="#5D6D7E" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M454,440 L402,440" fill="none" stroke="#5D6D7E" stroke-width="3" marker-end="url(#arrow)"/>
</g>
</svg>
