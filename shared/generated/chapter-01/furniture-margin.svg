<path d="M535,201.112 L815,206.423" fill="none" stroke="#1A5276" stroke-width="3"/>
<circle cx="815" cy="206.423" r="8" fill="#1A5276"/>
<text x="815" y="182.423" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="middle">42.26%</text>
<text x="1095" y="509" font-size="34" fill="#2C3E50" font-weight="bold" text-anchor="middle">Q4</text>
<path d="M815,206.423 L1095,215.309" fill="none" stroke="#1A5276" stroke-width="3"/>
<circle cx="1095" cy="215.309" r="8" fill="#1A5276"/>
<text x="1095" y="191.309" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="middle">40.78%</text>
<text x="140" y="561" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="start">Margin rate = (revenue − extended standard cost) ÷ revenue</text>
