<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="title desc">
<title id="title">Furniture margin rates in 2026</title>
<desc id="desc">2026-Q1: 43.05%; 2026-Q2: 43.15%; 2026-Q3: 42.26%; 2026-Q4: 40.78%. The vertical axis starts at zero. These are invoice-based rates at standard cost.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="none" stroke="#5D6D7E" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<g font-family="Arial, Liberation Sans, sans-serif">
<text x="140" y="43" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="start">Invoice-based margin at standard cost</text>
<text x="140" y="81" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="start">Furniture | fiscal 2026</text>
<path d="M140,460 L1220,460" fill="none" stroke="#CAD3DA" stroke-width="3"/>
<text x="122" y="470" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="end">0%</text>
<path d="M140,340 L1220,340" fill="none" stroke="#CAD3DA" stroke-width="3"/>
<text x="122" y="350" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="end">20%</text>
<path d="M140,220 L1220,220" fill="none" stroke="#CAD3DA" stroke-width="3"/>
<text x="122" y="230" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="end">40%</text>
<path d="M140,100 L1220,100" fill="none" stroke="#CAD3DA" stroke-width="3"/>
<text x="122" y="110" font-size="32" fill="#5D6D7E" font-weight="normal" text-anchor="end">60%</text>
<text x="255" y="509" font-size="34" fill="#2C3E50" font-weight="bold" text-anchor="middle">Q1</text>
<circle cx="255" cy="201.677" r="8" fill="#1A5276"/>
<text x="255" y="177.677" font-size="34" fill="#1A5276" font-weight="bold" text-anchor="middle">43.05%</text>
<text x="535" y="509" font-size="34" fill="#2C3E50" font-weight="bold" text-anchor="middle">Q2</text>
<path d="M255,201.677 L535,201.112" fill="none" stroke="#1A5276" stroke-width="3"/>
<circle cx="535" cy="201.112" r="8" fill="#1A5276"/>
