project:
  type: book
  pre-render:
    - python scripts/export_drawio_svgs.py

book:
  title: "Accounting Analytics: An Integrated Approach"
  output-file: "Accounting-Analytics"
  author: "Mauricio Codesso"
  cover-image: visuals/cover/cover.png
  cover-image-alt: "Cover of Accounting Analytics: An Integrated Approach"
  chapters:
    - index.qmd
    - front-matter/preface.qmd
    - front-matter/to-the-student.qmd
    - front-matter/about-the-dataset.qmd
    - front-matter/downloads.qmd
    - part: "Part I: Foundations of Accounting Analytics"
      chapters:
        - chapters/01-role-of-analytics/chapter.qmd
        - chapters/02-understanding-data/chapter.qmd
        - chapters/03-accounting-data-environment/chapter.qmd
    - part: "Part II: Accounting Analytics with Excel"
    - part: "Part III: Accounting Analytics with SQL"
    - part: "Part IV: Data Visualization and Power BI"
    - part: "Part V: Integrated and Applied Topics"


format:
  html:
    theme:
      - cosmo
      - styles/book.scss
    toc: true
    toc-depth: 2
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-newwindow: true
    number-sections: true
  pdf:
    documentclass: scrreprt
    papersize: letter
    classoption:
      - twoside
      - open=right
      - numbers=noendperiod
    geometry:
      - inner=0.75in
      - outer=0.5in
      - top=0.65in
      - bottom=0.75in
    include-in-header: styles/book-pdf.tex
    colorlinks: true
    number-sections: true
    number-depth: 3
    fig-cap-location: bottom
    tbl-cap-location: top
  docx:
    reference-doc: styles/reference.docx

crossref:
  fig-title: Figure
  tbl-title: Table
