project:
  type: book
  resources:
    - '!slides/**'
    - '!shared/calculations/**'
    - '!outputs/**'
    - '!supplementary/**'
    - '!instructor-notes/**'
    # Tells search engines they may crawl the site, and where book.site-url's sitemap.xml is.
    - robots.txt
    # The website's icons, at the root where browsers and search engines ask for /favicon.ico. Made by
    # scripts/make_favicons.py from visuals/branding/favicon.png; styles/book-html-head.html links them.
    - favicon.ico
    - favicon-48x48.png
    - favicon-96x96.png
    - favicon-192x192.png
    - apple-touch-icon.png
  pre-render:
    - python scripts/export_drawio_svgs.py --pre-render
  post-render:
    # Lists the homepage in sitemap.xml at its canonical address (Quarto writes /index.html, its canonical link says /)
    # and sets og:site_name on every page to indexing.site-identity.name, which Quarto overwrites with the book's title. Does
    # nothing for a render with no output to correct (the PDF, the print profiles).
    - python scripts/finish_site.py

filters:
  - filters/strip-comments.lua
  - filters/pdf-figures.lua
  # The EPUB and the DOCX get an optimized PNG of each diagram in place of its (large) SVG; scripts/figure_raster.py
  # makes them, as visuals/ebook-figures.yml sets. HTML and PDF are untouched.
  - filters/raster-figures.lua
  - filters/slide-links.lua
  # After Quarto's own filters, so the {{< var >}} values on the title and copyright pages are filled in
  # before the filter writes them out as LaTeX, XHTML or Word XML.
  - path: filters/book-pages.lua
    at: post-quarto
  # The metadata catalogs, search engines and stores read (the website's structured data and license link, the
  # EPUB's description and subjects, the PDF's XMP), from the book, isbn, doi, indexing, citation and license
  # blocks below. After Quarto's own filters, like book-pages.lua, so the edition and revision are known.
  - path: filters/book-metadata.lua
    at: post-quarto
  # After Quarto has rendered its figure nodes into <div>s that carry the figures' alt text: HTML5 allows alt only on
  # img, and EPUBCheck (and so Draft2Digital) rejects the EPUB for it. EPUB only.
  - path: filters/epub-markup.lua
    at: post-render
  - filters/pdf-code.lua
  - filters/learning-objectives.lua
  - filters/pdf-keep-together.lua

book:
  title: "Accounting Analytics: An Integrated Approach"
  output-file: "Accounting-Analytics"
  # The author and the identifiers that tell catalogs and search engines it is one person: the ORCID iD (Quarto's
  # own field), the ISNI, the affiliation's ROR ID and the faculty page (the website's structured data, through
  # filters/book-metadata.lua). The copyright page prints the ORCID iD and the ISNI too, and CITATION.cff repeats
  # the ORCID iD (tests/test_metadata.py checks that they agree and that both check digits are right).
  author:
    - name: "Mauricio Codesso"
      orcid: "0000-0002-6214-7177"
      isni: "0000000531767244"
      url: "https://damore-mckim.northeastern.edu/people/mauricio-codesso/"
      affiliations:
        - name: "Northeastern University"
          department: "D'Amore-McKim School of Business"
          city: "Boston"
          region: "MA"
          country: "US"
          ror: "https://ror.org/04t5xt781"
  # The publication date of the first edition: the EPUB's dc:date, Google Scholar's tags and the structured data.
  date: "2027-01-18"
  # The website's address, without a final slash (Quarto appends the social cards' /visuals/... image path to it).
  # Quarto builds sitemap.xml, the canonical links and the social cards' image links from it.
  site-url: "https://aa.accountinganalyticshub.com"
  # Social cards (Open Graph, X/Twitter) for every page: its title, its description (front matter, or the
  # description below), and the cover. The cover is portrait, so the small card suits it. og:site_name is the
  # site's name, "Accounting Analytics" (indexing.site-identity below; tests/test_metadata.py checks that they
  # agree). Quarto 1.10 writes the book's title there whatever site-name says, so scripts/finish_site.py corrects
  # it after the render.
  open-graph:
    site-name: "Accounting Analytics"
    locale: en_US
  twitter-card:
    card-style: summary
  # The sidebar's header on every page: the logo (scripts/make_favicons.py makes it from visuals/branding) over the
  # site's short name. Quarto prints no sidebar title when there is a logo and no title, hence both. The book's
  # full title stays the homepage's title and heading and the first entry of the contents.
  sidebar:
    logo: visuals/branding/aa-logo.png
    logo-alt: "Accounting Analytics logo"
    title: "Accounting Analytics"
  # The website's footer on every page (HTML only): the publisher and the publisher's page for this book, which
  # holds the publication catalog (indexing.hub below). Chapter text is untouched. The links are raw HTML because a
  # Markdown link in the book's metadata becomes an unused hyperlink relationship in the DOCX.
  page-footer:
    border: true
    left: 'Published by <a href="https://accountinganalyticshub.com/">Accounting Analytics Hub</a>'
    right: '<a href="https://accountinganalyticshub.com/books/accounting-analytics/">Publisher''s page for this book</a>'
  cover-image: visuals/cover/cover.png
  cover-image-alt: "Cover of Accounting Analytics: An Integrated Approach"
  chapters:
    - index.qmd
    - front-matter/preface.qmd
    - front-matter/downloads.qmd
    - part: "Foundations of Accounting Analytics"
      chapters:
        - chapters/01-role-of-analytics/chapter.qmd
        - chapters/02-understanding-data/chapter.qmd
        - chapters/03-accounting-data-environment/chapter.qmd
        - cases/part-1-case.qmd
    - part: "Accounting Analytics with Excel"
      chapters:
        - chapters/04-excel-essentials/chapter.qmd
        - chapters/05-data-preparation/chapter.qmd
        - chapters/06-descriptive-analytics/chapter.qmd
        - chapters/07-analysis-and-modeling/chapter.qmd
        - chapters/08-audit-analytics/chapter.qmd
        - cases/part-2-case.qmd
    - part: "Accounting Analytics with SQL"
      chapters:
        - chapters/09-sql-essentials/chapter.qmd
        - chapters/10-joining-and-summarizing/chapter.qmd
        - chapters/11-analytical-queries/chapter.qmd
        - chapters/12-sql-audit-analytics/chapter.qmd
        - cases/part-3-case.qmd
    - part: "Data Visualization and Power BI"
      chapters:
        - chapters/13-power-bi-essentials/chapter.qmd
        - chapters/14-data-models-and-dax/chapter.qmd
        - chapters/15-management-reports/chapter.qmd
        - chapters/16-audit-monitoring/chapter.qmd
        - cases/part-4-case.qmd
    - part: "Capstone Cases"
      chapters:
        - chapters/17-statements-for-a-lender/chapter.qmd
        - chapters/18-make-buy-or-reprice/chapter.qmd
        - chapters/19-customer-credits-audit/chapter.qmd
    - back-matter/closing.qmd
  appendices:
    - appendices/a-quick-reference/appendix.qmd
    - appendices/b-publishing-security/appendix.qmd
    - appendices/c-power-bi-browser/appendix.qmd
    - appendices/d-competencies/appendix.qmd

# The ISBN of each version of the book, printed on the copyright page of the PDF, EPUB and DOCX
# (front-matter/_book-pages.qmd, laid out by filters/book-pages.lua; the website has no copyright page).
# A revision keeps its edition's ISBNs. A blank one prints "ISBN to be assigned". Type an ISBN-13 with or
# without hyphens; a wrong check digit fails the render. They live here, not in _variables.yml, because
# _variables.yml is an input of every slide deck (scripts/release.py), and _quarto.yml only of the book.
isbn:
  pdf: &isbn-pdf "978-65-978221-9-5"
  epub: "978-65-978221-8-8"
  paperback-bw: "978-65-978221-7-1"
  paperback-color: "978-65-978221-4-0"
  hardcover: "978-65-978221-5-7"

# The book's DOI, from Zenodo (the author's, 2026-10-16; Zenodo gives each version a DOI and all versions a concept
# DOI). Type the DOI alone, 10.xxxx/yyyy, without https://doi.org/; a value that is not a DOI fails the render, and a
# blank one leaves it out everywhere. The copyright page prints it under the ISBNs, the suggested citation (copyright
# page and homepage) ends with https://doi.org/... in place of the website's address (APA 7), and it reaches Google
# Scholar's tags on the homepage, the structured data, the EPUB's identifiers and the PDF's XMP metadata. After
# changing it, run python scripts/citation_cff.py (tests/test_metadata.py fails until CITATION.cff agrees).
doi: "10.5281/zenodo.23425591"

# What catalogs, stores and search engines read about the book besides its title, author and ISBNs. Unknown to
# Quarto, so its own templates never show it: filters/book-metadata.lua and the anchors below put it where it goes.
indexing:
  # How search engines name this website (author's request 2026-10-20). Google reads the WebSite structured data on
  # the homepage first (name and alternateName, filters/book-metadata.lua), then og:site_name (book.open-graph), the
  # <title> and the headings. The preferred name is neither the book's title, which stays the homepage's <title>, nor
  # the publisher's name. (Kept inside this block: a new top-level key would become an empty custom property of the
  # DOCX, as every top-level map does.)
  site-identity:
    name: "Accounting Analytics"
    alternate-name:
      - "Accounting Analytics Textbook"
  # The publisher's website, Accounting Analytics Hub, owns the publication catalog: its page for this book is the
  # authoritative landing page, and its structured data defines the publisher, the author, the work and each edition
  # by @id (<url>#organization, <author-url>#person, <book-url>#book and #edition-pdf, -epub, -paperback-bw,
  # -paperback-color, -hardcover). The structured data of this website reuses those ids and the same names, ISBNs and
  # edition wording, so that the two describe one book. This website owns the full text and is never canonicalized
  # to the Hub. Each URL ends in a slash.
  hub:
    name: "Accounting Analytics Hub"
    url: "https://accountinganalyticshub.com/"
    book-url: "https://accountinganalyticshub.com/books/accounting-analytics/"
    author-url: "https://accountinganalyticshub.com/author/mauricio-codesso/"
  # The long description: the EPUB's dc:description, the DOCX's Comments, Google Scholar's citation_abstract on the
  # homepage, the structured data and CITATION.cff's abstract. A retailer that asks for one (IngramSpark) takes it
  # too. The short one, for search results and social cards, is `description` below.
  summary: &summary >-
    Accounting Analytics: An Integrated Approach is an open textbook that teaches accounting and business students
    to extract, prepare, analyze, and visualize financial and operational data with Microsoft Excel, SQL, and
    Microsoft Power BI. Every technique is taught through an accounting question, and every example draws on the
    records of one fictional company in the Charles River Accounting Dataset, so a customer order analyzed in Excel
    is the same one found in the general ledger with SQL and reported on in Power BI. Part I lays the foundations of
    accounting analytics, data quality, and the relational database behind accounting systems. Part II teaches data
    preparation, descriptive analytics, forecasting, budgeting, what-if analysis, and audit testing in Excel. Part
    III queries, joins, and summarizes whole populations of transactions in SQL, for management questions and for
    audit tests. Part IV turns to data visualization, data models, DAX measures, management reports, and audit
    monitoring in Power BI. Part V offers capstone cases in financial reporting, managerial accounting, and
    auditing. The chapters of Parts I to IV combine guided tutorials, multiple-choice questions, and exercises from
    the perspectives of financial accounting, managerial accounting, and auditing, and each of these Parts closes
    with a comprehensive case. The book is written for undergraduate and graduate students with no prior analytics
    or programming experience. It is free to read online and to download, as are its dataset, slides, companion
    files, and solutions, and it is licensed under CC BY-SA 4.0.
  # The PDF's and the DOCX's keywords, Google Scholar's citation_keywords and the structured data. Top-level
  # `keywords` would also print a Keywords block under the title of every chapter page.
  # (The digital PDF's keywords come through filters/book-metadata.lua; the DOCX takes this list by its anchor.)
  keywords: &keywords
    - Accounting Analytics
    - Data Analytics
    - Accounting Information Systems
    - Financial Accounting
    - Managerial Accounting
    - Auditing
    - Audit Data Analytics
    - Continuous Auditing
    - Data Visualization
    - Business Intelligence
    - Relational Databases
    - Microsoft Excel
    - Power Query
    - SQL
    - SQLite
    - Microsoft Power BI
    - DAX
    - Open Educational Resources
    - Open Textbook
    - Charles River Accounting Dataset
  # Who the book is for and what kind of resource it is: the structured data's audience, educationalLevel and
  # learningResourceType, which catalogs of open educational resources read.
  audience: [student, teacher]
  educational-level: [Undergraduate, Graduate]
  resource-type: Textbook
  # BISAC subject codes, most important first (checked against BISG's lists on 2026-10-16). IngramSpark and most
  # retailers take the first three; the EPUB carries them all, and the structured data names them.
  bisac:
    - {code: BUS001000, heading: "BUSINESS & ECONOMICS / Accounting / General"}
    - {code: COM021030, heading: "COMPUTERS / Data Science / Data Analytics"}
    - {code: BUS003000, heading: "BUSINESS & ECONOMICS / Auditing"}
    - {code: BUS001040, heading: "BUSINESS & ECONOMICS / Accounting / Managerial"}
    - {code: BUS001010, heading: "BUSINESS & ECONOMICS / Accounting / Financial"}
    - {code: COM005030, heading: "COMPUTERS / Business & Productivity Software / Business Intelligence"}

# The short description (at most about 155 characters, which search results show in full): the homepage's meta
# description and social card, and the default for a page whose front matter has no description of its own. Every
# page of the book has one, written for that page. (book.description would replace them all with the book's.)
description: "A free, open textbook that teaches accounting analytics with Excel, SQL, and Power BI, using the Charles River Accounting Dataset. Read online or download."

# The book's own citation. index.qmd turns on Google Scholar's tags (google-scholar), so the homepage is the one
# record of the book and the chapters carry none (Quarto never prints this in a book; the suggested citations of
# the copyright page and the homepage are written out in their text).
citation:
  type: book
  title: "Accounting Analytics: An Integrated Approach"
  publisher: "Accounting Analytics Hub"
  issued: "2027-01-18"
  language: en-US
  isbn: *isbn-pdf
  abstract: *summary

# The license and the copyright: the website's <link rel="license">, the structured data, and the PDF's XMP
# (filters/book-metadata.lua). The copyright page's own text is in front-matter/_book-pages.qmd.
license:
  text: "Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)"
  link: "https://creativecommons.org/licenses/by-sa/4.0/"
copyright:
  holder: "Mauricio Codesso"
  year: 2027

# The image of every page's social card (a page's first figure otherwise, which is an SVG the platforms ignore).
image: /visuals/cover/cover-web.png
image-alt: "Cover of Accounting Analytics: An Integrated Approach"

format:
  html:
    cover-image: visuals/cover/cover-web.png
    theme:
      - cosmo
      - styles/book.scss
    toc: true
    toc-depth: 2
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-newwindow: true
    number-sections: true
    # <link rel="canonical"> on every page, from book.site-url, so search engines index each page at one address.
    canonical-url: true
    # The website's icons: favicon.ico and the PNGs at the project root (resources above), linked by root-relative
    # address, because the site is served from the root of its own subdomain. Google keeps one favicon per hostname,
    # so these do not depend on the icons of accountinganalyticshub.com. Quarto's own favicon option is left unset:
    # it would add a second rel="icon". HTML only; the file holds no comment, which would ship in every page.
    include-in-header: styles/book-html-head.html
  pdf:
    documentclass: scrreprt
    papersize: letter
    classoption:
      - twoside
      - open=right
      - numbers=noendperiod
    # The same page as the print interiors (print/book-print.tex), so the digital PDF and the printed book
    # break their pages alike: the printer's safe area of 0.5in from every trim edge plus 0.125in of no ink at
    # the spine, room past the outer edge of the text for microtype's protrusion and the code shading (about
    # 0.04in), the running head (styles/book-pdf.tex, 0.12in above the text) 0.5in from the top edge, and the
    # page numbers 0.6in above the bottom edge.
    geometry:
      - inner=0.75in
      - outer=0.625in
      - top=0.8in
      - bottom=0.9in
      - footskip=0.3in
    include-in-header: styles/book-pdf.tex
    colorlinks: true
    number-sections: true
    number-depth: 3
    fig-cap-location: bottom
    tbl-cap-location: top
    # The PDF's Subject (a document property). Its keywords, language and XMP metadata come from
    # filters/book-metadata.lua: `lang` here would also load babel, which changes the line breaks.
    subject: "An open textbook on accounting analytics with Microsoft Excel, SQL, and Microsoft Power BI"
  epub:
    cover-image: visuals/cover/cover.png
    # Pandoc's EPUB template, whose title page prints the book's title and copyright pages
    # (front-matter/_book-pages.qmd, through filters/book-pages.lua) in place of Pandoc's own.
    template: styles/book-epub.template
    publisher: "Accounting Analytics Hub"
    rights: "Copyright © 2027 Mauricio Codesso. Licensed under CC BY-SA 4.0: https://creativecommons.org/licenses/by-sa/4.0/"
    # The book's EPUB styles (the learning objectives box), in every page's head.
    include-in-header: styles/book-epub-head.html
  docx:
    reference-doc: styles/reference.docx
    # filters/book-pages.lua writes the table of contents after the title and copyright pages; Pandoc's
    # would come before them.
    toc: false
    # The DOCX's Subject and Keywords (its document properties); filters/book-metadata.lua sets its Comments.
    subject: "An open textbook on accounting analytics with Microsoft Excel, SQL, and Microsoft Power BI"
    keywords: *keywords

crossref:
  fig-title: Figure
  tbl-title: Table
