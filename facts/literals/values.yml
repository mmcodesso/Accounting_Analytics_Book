# How the exact values in the text are classified (facts/visible_values.py; Phase 7 of the yearly-roll program).
#
# An exact value is a numeric literal written with digits in a file in scope: the book's .qmd files and
# shared/fragments, the slides decks, and the code that mirrors the text. Years, dates and document numbers
# belong to facts/literals/{years,dates,ids}.yml. This file classifies everything else that is not
# structural (a reference such as Tutorial 4.1 or Step 3, a list number, a slide timing, a multiple-choice
# key, an account number, a single digit that does not count data, a tolerance or cell reference, which
# visible_values.py recognizes by its context).
#
# A literal is one of:
#   key       a value the roll rewrites: the literal, in its display format, equals the key's value on the
#             edition's dataset (facts/visible_values.py values()). Keys are val.* (computed in
#             facts/visible_values_data.py) or registry keys of agent A's facts/visible.py (id.trace.invoice_id).
#   constant  a teaching constant, threshold, software fact, real-world figure or generic illustration that a
#             roll keeps (1,000 rows profiled, a 5% policy, the $15,000 mistyped as $1,500).
#   computed  code that computes the value from the dataset, so there is nothing to rewrite.
#   review    a figure that may change with a roll, with no registry key yet: the impact report lists it for the
#             author to check by hand (the note says what to look at).
#
# Sections (consulted in this order): files: path -> {literal as written: spec}, rules: patterns by file glob,
# literal regex and context regex, everywhere: literal -> spec. A spec is "constant", a key, or a mapping
# {key|class, format, context, note}; `context` is a regular expression searched in the 70 characters before and
# 50 after the literal, so one literal can mean two things in one file (a spec with a context wins).
# Formats (see visible_values.py): "$,.2" dollars with separators and two decimals, ".1%" a fraction as a
# percentage, ".1 percent" the same in words, ".1M" millions, "+ ,.2" signed, "abs ,.2" absolute value,
# "~10 $.0" about (to a multiple of 10), "floor100000 ,.0" more than. The inference from the literal is right
# for most keys, so a format is written only where it is not (a positive literal for a negative value).

rules:
  - name: aging buckets (current, 1-30, 31-60, 61-90, over 90 days past due)
    class: constant
    literal: '1|30|31|60|61|90|91|0'
    context: '(?i)(past due|aging|bucket|days late|over 90|more than 90|1 to 30|31 to 60|61 to 90|1-30|31-60|61-90|1–30|31–60|61–90|DaysPastDue|Over 90)'
  - name: payment terms in days (30, 45, 60, 90)
    class: constant
    literal: '30|45|60|90|31'
    context: 'DaysToDue|DaysPastDue'
  - name: the 1,000 rows Power Query profiles by default
    class: constant
    literal: '1,000|1000'
    context: '(?i)(top 1,000|first 1,000|1,000 rows|1,000 lines|1,000 invoice|first 1000|top 1000|profil)'
  - name: the first 200 rows that decide a Power Query column type
    class: constant
    literal: '200'
    context: '(?i)first 200'
  - name: a rate per 1,000 documents
    class: constant
    literal: '1,000|1000|1000\.0'
    context: '(?i)(per 1,000|per 1000|\* 1000|1000 \*|1000 \* n|Per 1,000)'
  - name: the twelve months of a year, trailing windows, lags
    class: constant
    literal: '12|11|-12|-3|24'
    context: '(?i)(MonthsInWindow|PRECEDING|LAG\(|DATESINPERIOD|[*] ?12|12 months|twelve|12\) ?\)|SEQUENCE|MOVINGAVERAGE|, 12, 5|substr|MONTHS|, -12|EDATE|k < 11|[+] 12|1 to 12|range\(1, 13\))'
  - name: SQL date modifiers
    class: constant
    literal: '\+1|-1'
    context: "(?i)(month'|day'|modifier|start of month)"
  - name: a sample or population of generic size in an illustration
    class: constant
    literal: '(5|10|15|20|45|55|50)'
    context: '(?i)(a customer (has|with)|those 10 orders|total of 45|1 row B|10 rows|45 rows|55 rows|orders and 20 line|appear 15 times|count the customer 15|factor of 20)'
  - name: license and standards
    class: constant
    literal: '4\.0'
    context: '(?i)(BY-SA|ShareAlike|license)'
  - name: image width and layout attributes
    class: constant
    literal: '\d{2,3}%'
    context: 'width=|height='
  - name: Excel number formats and DAX format strings
    class: constant
    literal: '[0#.,]+%?'
    context: 'NumberFormat|FormatString|format_string|FORMAT \('
  - name: AccountID values (the Account surrogate key; AccountID 42 is account 4010)
    context: 'AccountID[^.;]{0,45}\b{lit}\b'
    map:
      "2": val.account_id.1010
      "3": val.account_id.1020
      "4": val.account_id.1030
      "5": val.account_id.1040
      "22": val.account_id.2010
      "26": val.account_id.2050
      "27": val.account_id.2060
      "41": val.account_id.4000
      "42": val.account_id.4010
      "46": val.account_id.4050
      "50": val.account_id.5010
      "54": val.account_id.5050
      "55": val.account_id.5060
      "74": val.account_id.6170
      "92": val.account_id.1090
      "93": val.account_id.5080
      "104": val.account_id.6290
  - name: a tolerance for comparing decimals (0.0001, 0.001, 0.01)
    class: constant
    literal: '-?0\.0{1,3}1'
  - name: the wording of the generated notes (thresholds, references and policies the exercises set; the values come from the context functions and are rendered from the window)
    class: constant
    files: ["facts/notes/templates/*"]
    literal: '.*'
  - name: worksheet row numbers named in the steps (row 15, rows 22 to 26)
    class: constant
    literal: '\d{1,3}'
    context: '(?i)\brows?\b[^.;`]{0,30}\b{lit}\b'
  - name: layout, font-metric and contrast constants of the figure generator
    class: constant
    files: ["scripts/figures/check_figures.py", "scripts/figures/drawio.py", "scripts/figures/dbbrowser.py", "scripts/figures/excel.py", "scripts/figures/powerbi.py"]
    literal: '.*'
    origin: constant
  - name: numeric tables of the companion builders and the note modules (rates, strata, months, codes, tables numbers, colors); data-bearing ones are listed per file
    class: constant
    files: ["scripts/companion/*/*.py", "facts/notes/*.py"]
    literal: '.*'
    origin: constant

