# Document IDs and codes in the text, and the keys of facts/visible.py that select them in any build
# (Phase 7 of the yearly-roll program). roll_text.py replaces each literal with its key's value in the new
# edition's snapshot; the lint fails on an ID or code with no entry here, and on a key whose value on the
# edition's dataset differs from the literal. The selection rules (visible.py) state the properties of each
# document that the text relies on.
#
# The workbook's Table names (T17_SalesInvoiceLine) are schema names that a roll keeps; textscan.py treats
# them as constants.

ids:
  # the traced sale (Chapter 1, Tutorial 3.2, Figure 3.10)
  SI-2025-007947: id.trace.invoice
  SO-2024-001697: id.trace.order
  SH-2025-003603: id.trace.shipment
  CR-2025-003043: id.trace.receipt
  FUR-DSK-0075: id.trace.item_code
  # the year-end closes
  JE-2024-000265: id.close.pl.F
  JE-2024-000266: id.close.re.F
  JE-2025-000287: id.close.pl.P
  JE-2025-000288: id.close.re.P
  JE-2026-000296: id.close.pl.C
  JE-2026-000297: id.close.re.C
  # journal entries, purchase orders, pay periods, promotions, invoices, work orders
  JE-2024-000001: id.je.opening
  PO-2024-000474: id.po_after_termination.F
  PO-2025-003922: id.po_after_termination.P
  PO-2026-010467: id.po_after_termination.C
  PP-2026-078: id.pay_period.open.1
  PP-2026-079: id.pay_period.open.2
  PROMO-2026-008: id.promo.furniture
  SI-2024-000001: id.invoice_before_shipment
  SI-2026-019134: id.invoice.fan_out
  WO-2026-011512: id.wo.oldest_open
  # the data-quality panels of Chapter 2 (shared/calculations/foundations.py)
  SH-2024-000001: id.ship.first.1
  SH-2024-000002: id.ship.first.2
  SH-2024-000003: id.ship.first.3
  SH-2024-000028: id.ship.blank_tracking.before
  SH-2024-000029: id.ship.blank_tracking.1
  SH-2024-000049: id.ship.blank_tracking.2
  SH-2024-000004: id.ship.in_transit.1
  SH-2024-000038: id.ship.in_transit.2
  SH-2026-008319: id.ship.max_freight
  V0002-2024-000182: id.supplier_invoice.duplicate
  V0002-2024-000204: id.supplier_invoice.after_duplicate

# IDs and codes that a roll keeps, by file: rx must match a span that contains the literal.
constant:
  facts/notes/case4.py:
    - {rx: "'SI-2025-006733 to 006735'|'SI-2025-000001 and 000002'", why: "a docstring's example of a number format"}
  chapters/05-data-preparation/*.qmd:
    - {rx: 'FUR-DSK-0075|FUR-SDB-0002', why: "item master examples of the code pattern (master data is the same in every build)"}
  slides/chapter-05/index.qmd:
    - {rx: 'FUR-DSK-0075|FUR-SDB-0002', why: "item master examples of the code pattern"}
  scripts/figures/ch05.py:
    - {rx: 'FUR-DSK-0075|FUR-SDB-0002', why: "item master examples of the code pattern"}
  shared/calculations/excel_analysis.py:
    - {rx: 'FUR-DSK-0075|FUR-SDB-0002', why: "item master examples of the code pattern"}
  "*":
    - {rx: 'GRP-TYP-9999', why: "the pattern of an item code, not a code"}
