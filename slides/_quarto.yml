# The chapter and comprehensive-case slide decks: one project, two formats (Reveal.js for the browser, native PowerPoint).
# Build with scripts/build_all.py, which first writes the generated inputs under _shared/ and each
# deck's _metadata.yml (title, footer, output names) from the book. See README.md.
project:
  type: default
  output-dir: _build/revealjs
  render:
    - "chapter-*/index.qmd"
    - "case-part-*/index.qmd"
  # A default project copies the files it finds to the output; publish only what the decks show,
  # and never the build tree itself (a render would otherwise copy _build into its own output).
  resources:
    - "_shared/visuals/*"
    - "_shared/theme/*.png"
    - "!_build/**"
    - "!theme/**"
    - "!filters/**"
    - "!shortcodes/**"
    - "!README.md"
    - "!_variables.yml"
    - "!_shared/**/*.qmd"
    - "!_shared/**/*.json"
    - "!_shared/**/*.pptx"
    - "!_shared/**/*.scss"
    - "!_shared/**/*.yml"

lang: en
metadata-files:
  - _shared/theme/metadata.yml
slide-level: 2

filters:
  - ../filters/strip-comments.lua
  - filters/images.lua
  - filters/deck.lua
shortcodes:
  - shortcodes/book.lua

format:
  revealjs:
    theme: [default, _shared/theme/tokens.scss, theme/reveal.scss]
    width: 1280
    height: 720
    margin: 0.04
    center: false
    transition: none
    background-transition: none
    incremental: false
    controls: true
    progress: true
    slide-number: c/t
    menu: true
    history: true
    embed-resources: false
    code-copy: false
    # PowerPoint shows no line numbers, and a slide's short query needs none.
    code-line-numbers: false
    auto-stretch: true
    html-math-method: mathml
    title-slide-attributes:
      data-background-color: "#1A5276"
      data-state: title-state
    include-after-body:
      text: |
        <script>
        (() => {
          const keepSlideMode = () => {
            Reveal.configure({ scrollActivationWidth: 0 });
            if (Reveal.isScrollView()) Reveal.toggleScrollView(false);
          };
          if (Reveal.isReady()) keepSlideMode();
          else Reveal.on('ready', keepSlideMode);
        })();
        </script>
  pptx:
    incremental: false

execute:
  enabled: false
