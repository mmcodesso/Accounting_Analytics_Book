# Companion files: the files readers download to start a tutorial without the earlier ones.
#
# Each chain is one file that a run of tutorials builds. The builder writes the file as it stands
# at the end of every tutorial in the chain. The start file of a tutorial is the end file of the
# tutorial before it, and the chapter-end file is the copy the chapter's exercises start from.
# audience: every file is public (author's decision, 2026-10-05): the start and end files and the solutions
# (exercises, cases, and capstones) are tracked in supplementary/, which the site serves (supplementary/README.md).
#
# Build with:  python scripts/companion/build.py [--tool sql|excel|pbi] [--chapter 10]
# Publish with: python scripts/companion/build.py --publish   (copies the built files into supplementary/)

start_folder: start-files            # the build folder of the start files under outputs/companion/ (published to supplementary/start-files/)
solutions_folder: solutions          # the build folder of the solutions under outputs/companion/ (published to supplementary/solutions/)

chains:
  - id: ch04-07-analysis
    tool: excel
    chapters: [4, 5, 6, 7]
    file: Charles River Furniture Analysis.xlsx
    builder: xlbuild.analysis        # scripts/companion/xlbuild/analysis.py, one function per tutorial
    audience: public
  - id: ch08-audit
    tool: excel
    chapters: [8]
    file: AuditAnalytics.xlsx
    builder: xlbuild.audit           # scripts/companion/xlbuild/audit.py
    audience: public
  - id: ch13-15-reports
    tool: pbi
    chapters: [13, 14, 15, "A"]      # "A": the appendix on publishing and security (Guided Tutorial A.1)
    file: Charles River Reports.pbip
    builder: pbibuild.reports        # scripts/companion/pbibuild/reports.py, one function per tutorial
    table: SalesInvoiceLine          # the model has loaded once this table is in the engine
    also:                            # Guided Tutorial A.1 Step 1 starts in internal audit's file of Chapter 16
      "Start of Tutorial A.1": {chain: ch16-monitoring, after: "16.3"}
    audience: public
  - id: ch16-monitoring
    tool: pbi
    chapters: [16]
    file: Audit Monitoring.pbip
    builder: pbibuild.audit_monitoring   # scripts/companion/pbibuild/audit_monitoring.py
    table: JournalEntry
    also:                            # Tutorial 16.3 Step 8 reruns the package's tests in the controller's file
      "Start of Tutorial 16.3": {chain: ch13-15-reports, after: "15.3"}
    audience: public
  - id: ch09-script
    tool: sql
    chapter: 9
    file: Chapter09.sql
    script: ch09.CHAPTER09           # scripts/figures/ch09.py, the script the tutorial text must match
    audience: public
  - id: ch10-script
    tool: sql
    chapter: 10
    file: Chapter10.sql
    script: ch10.CHAPTER10
    audience: public
  - id: ch11-script
    tool: sql
    chapter: 11
    file: Chapter11.sql
    script: ch11.CHAPTER11
    audience: public
  - id: ch12-script
    tool: sql
    chapter: 12
    file: Audit.sql
    script: ch12.CHAPTER12
    audience: public

extras:
  - id: part3-views
    tool: sql
    file: Setup_Part3_Views.sql
    from: ch11.CHAPTER11:create_view  # the view Tutorial 11.3 saves in the working copy
    audience: public

solutions:                           # instructor files, built with --solutions after the chains
  - id: ch04-exercises
    tool: excel
    chapter: 4
    file: Chapter 4 Exercises - Solutions.xlsx
    base: {chain: ch04-07-analysis, after: "4.3"}   # the chapter-end checkpoint the exercises copy
    builder: xlbuild.ex04
    audience: instructor
  - id: ch05-exercises
    tool: excel
    chapter: 5
    file: Chapter 5 Exercises - Solutions.xlsx
    base: {chain: ch04-07-analysis, after: "5.3"}   # the chapter-end checkpoint the exercises copy
    builder: xlbuild.ex05
    audience: instructor
  - id: ch06-exercises
    tool: excel
    chapter: 6
    file: Chapter 6 Exercises - Solutions.xlsx
    base: {chain: ch04-07-analysis, after: "6.3"}   # the chapter-end checkpoint the exercises copy
    builder: xlbuild.ex06
    audience: instructor
  - id: ch07-exercises
    tool: excel
    chapter: 7
    file: Chapter 7 Exercises - Solutions.xlsx
    base: {chain: ch04-07-analysis, after: "7.3"}   # the chapter-end checkpoint the exercises copy
    builder: xlbuild.ex07
    audience: instructor
  - id: ch08-exercises
    tool: excel
    chapter: 8
    file: Chapter 8 Exercises - Solutions.xlsx
    base: {chain: ch08-audit, after: "8.3"}   # the chapter-end checkpoint the exercises copy
    builder: xlbuild.ex08
    audience: instructor
  - id: ch13-exercises-pbi
    tool: pbi
    chapter: 13
    file: Chapter 13 Exercises - Solutions.pbip
    base: {chain: ch13-15-reports, after: "13.3"}   # the reader's Save as copy starts here
    builder: pbibuild.ex13
    audience: instructor
  - id: ch14-exercises-pbi
    tool: pbi
    chapter: 14
    file: Chapter 14 Exercises - Solutions.pbip
    base: {chain: ch13-15-reports, after: "14.3"}   # the reader's Save as copy starts here
    builder: pbibuild.ex14
    audience: instructor
  - id: ch15-exercises-pbi
    tool: pbi
    chapter: 15
    file: Chapter 15 Exercises - Solutions.pbip
    base: {chain: ch13-15-reports, after: "15.3"}   # the reader's Save as copy starts here
    builder: pbibuild.ex15
    audience: instructor
  - id: ch16-exercises-pbi
    tool: pbi
    chapter: 16
    file: Chapter 16 Exercises - Solutions.pbip
    base: {chain: ch16-monitoring, after: "16.3"}   # the reader's Save as copy starts here
    builder: pbibuild.ex16
    audience: instructor
  - id: appendix-a-exercises-pbi
    tool: pbi
    chapter: "A"
    file: Appendix A Exercises - Solutions.pbip
    base: {chain: ch13-15-reports, after: "A.1"}   # the reader's Save as copy starts here
    builder: pbibuild.exa
    audience: instructor
  - id: part2-case
    tool: excel
    kind: requirements              # sections are the case's Requirements, with their instructor notes
    source: cases/part-2-case.qmd
    file: Charles River Promotion Case.xlsx
    folder: PartII-case
    role: the solution to the Part II comprehensive case, built in a new workbook as the case says
    builder: xlbuild.case2
    audience: instructor
  - id: ch17-capstone
    tool: excel
    chapter: 17
    kind: requirements
    source: chapters/17-statements-for-a-lender/chapter.qmd
    file: Charles River Lender Package.xlsx
    folder: Chapter17-capstone-excel
    role: the Excel part of the solution to the Chapter 17 capstone case
    builder: xlbuild.cap17
    audience: instructor
  - id: ch18-capstone
    tool: excel
    chapter: 18
    kind: requirements
    source: chapters/18-make-buy-or-reprice/chapter.qmd
    file: Make Buy Reprice.xlsx
    folder: Chapter18-capstone-excel
    role: the Excel part of the solution to the Chapter 18 capstone case
    builder: xlbuild.cap18
    audience: instructor
  - id: ch19-capstone
    tool: excel
    chapter: 19
    kind: requirements
    source: chapters/19-customer-credits-audit/chapter.qmd
    file: Credits Audit.xlsx
    folder: Chapter19-capstone-excel
    role: the Excel part of the solution to the Chapter 19 capstone case
    builder: xlbuild.cap19
    audience: instructor
  - id: part4-case
    tool: pbi
    kind: requirements
    source: cases/part-4-case.qmd
    file: Charles River Cash Case.pbip
    folder: PartIV-case
    role: the solution to the Part IV comprehensive case, built in a new Power BI file as the case says
    builder: pbibuild.case4
    table: GLEntry                  # the model has loaded once this table is in the engine (the builder may change it)
    audience: instructor
  - id: ch17-capstone-pbi
    tool: pbi
    chapter: 17
    kind: requirements
    source: chapters/17-statements-for-a-lender/chapter.qmd
    file: Charles River Lender Review.pbip
    folder: Chapter17-capstone-pbi
    role: the Power BI part of the solution to the Chapter 17 capstone case (the Review file of Requirements 2 and 6)
    builder: pbibuild.cap17
    table: GLEntry                  # the model has loaded once this table is in the engine
    also_sources:                   # the package workbook the Review file loads: read from C:\CharlesRiver\<name> when shipped
      Charles River Lender Package.xlsx: outputs/companion/solutions/Chapter17-capstone-excel/Charles River Lender Package.xlsx
    audience: instructor
  - id: ch18-capstone-pbi
    tool: pbi
    chapter: 18
    kind: requirements
    source: chapters/18-make-buy-or-reprice/chapter.qmd
    file: Product Costs.pbip
    folder: Chapter18-capstone-pbi
    role: the Power BI part of the solution to the Chapter 18 capstone case
    builder: pbibuild.cap18
    table: SalesInvoiceLine         # (the builder may change it)
    also_sources:                   # the case workbook the explorer loads: read from C:\CharlesRiver\<name> when shipped
      Make Buy Reprice.xlsx: outputs/companion/solutions/Chapter18-capstone-excel/Make Buy Reprice.xlsx
    audience: instructor
  - id: ch19-capstone-pbi
    tool: pbi
    chapter: 19
    kind: requirements
    source: chapters/19-customer-credits-audit/chapter.qmd
    file: Credits Analytics.pbip
    folder: Chapter19-capstone-pbi
    role: the Power BI part of the solution to the Chapter 19 capstone case (Requirement 5)
    builder: pbibuild.cap19
    table: CustomerRefund           # the model has loaded once this table is in the engine
    also_sources:                   # the refund flags Credits.sql exports (Requirement 4); the builder writes the file
      RefundFlags.csv: outputs/companion/solutions/Chapter19-capstone-pbi/RefundFlags.csv
    include_sources: [RefundFlags.csv]   # shipped in the zip beside the project
    audience: instructor
  - id: ch19-monitoring-pbi
    tool: pbi
    chapter: 19
    kind: requirements              # sections are the capstone's Requirement 10 and Milestones, with their notes
    source: chapters/19-customer-credits-audit/chapter.qmd
    file: Audit Monitoring.pbip
    folder: Chapter19-capstone-pbi-monitoring
    role: the Power BI part of the solution to the Chapter 19 capstone case (Requirement 10), built on a copy of Audit Monitoring at the end of Tutorial 16.3
    base: {chain: ch16-monitoring, after: "16.3"}   # Requirement 10 updates internal audit's file of Chapter 16
    builder: pbibuild.cap19_monitoring
    audience: instructor
  - id: ch09-exercises-sql
    tool: sql
    chapter: 9
    builder: sqlbuild.ex09
    audience: instructor
  - id: ch10-exercises-sql
    tool: sql
    chapter: 10
    builder: sqlbuild.ex10
    audience: instructor
  - id: ch11-exercises-sql
    tool: sql
    chapter: 11
    builder: sqlbuild.ex11
    setup_views: true              # the view MonthlyLaborEfficiency of Tutorial 11.3, as a TEMP view
    audience: instructor
  - id: ch12-exercises-sql
    tool: sql
    chapter: 12
    builder: sqlbuild.ex12
    setup_views: true              # the view MonthlyLaborEfficiency of Tutorial 11.3, as a TEMP view
    audience: instructor
  - id: part3-case-sql
    tool: sql
    kind: requirements
    source: cases/part-3-case.qmd
    folder: PartIII-case-sql
    role: the solution to the Part III comprehensive case (Case.sql)
    builder: sqlbuild.case3
    setup_views: true               # the case reads Tutorial 11.3's view
    audience: instructor
  - id: ch17-capstone-sql
    tool: sql
    chapter: 17
    kind: requirements
    source: chapters/17-statements-for-a-lender/chapter.qmd
    folder: Chapter17-capstone-sql
    role: the SQL part of the solution to the Chapter 17 capstone case (LenderPackage.sql)
    builder: sqlbuild.cap17
    audience: instructor
  - id: ch18-capstone-sql
    tool: sql
    chapter: 18
    kind: requirements
    source: chapters/18-make-buy-or-reprice/chapter.qmd
    folder: Chapter18-capstone-sql
    role: the SQL part of the solution to the Chapter 18 capstone case (MakeBuy.sql)
    builder: sqlbuild.cap18
    audience: instructor
  - id: ch19-capstone-sql
    tool: sql
    chapter: 19
    kind: requirements
    source: chapters/19-customer-credits-audit/chapter.qmd
    folder: Chapter19-capstone-sql
    role: the SQL part of the solution to the Chapter 19 capstone case (Credits.sql)
    builder: sqlbuild.cap19
    audience: instructor
