name: Build and Publish Quarto Book

# Renders and deploys the site only: the book's HTML and the Reveal decks. The PDF, EPUB, DOCX, the PowerPoint
# decks and the companion files are built locally and published as the assets of the revision's GitHub release
# (book in _variables.yml) by scripts/release.py, which the site links. No TeX, Draw.io or PowerPoint step runs here.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "quarto-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/slides/requirements.txt

      - name: Install slide build dependencies
        run: python -m pip install -r scripts/slides/requirements.txt

      - name: Check the slide sources and run the regression tests
        # Dataset-free and Quarto-free: every cited book figure and table exists, every slide has notes,
        # no deck names the author. Editing a chapter never fails this step.
        run: |
          python scripts/build_all.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
          tinytex: false

      - name: Build the site
        # The committed Draw.io exports must be current (export_drawio_svgs.py --verify); the decks are
        # rendered for the browser only.
        run: python scripts/build_all.py --site

      - name: Check the release files
        # Fails if the site links a file the revision's release lacks; warns (job summary) when a
        # PDF, EPUB, DOCX or PowerPoint file on the release was built before the latest text.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py check --site _book

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
