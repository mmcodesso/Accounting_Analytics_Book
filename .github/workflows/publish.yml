name: Build and Publish Quarto Book

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "quarto-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/slides/requirements.txt

      - name: Install slide build dependencies
        run: python -m pip install -r scripts/slides/requirements.txt

      - name: Check the slide sources and run the regression tests
        # Dataset-free and Quarto-free: every cited book figure and table exists, every slide has notes,
        # no deck names the author. Editing a chapter never fails this step.
        run: |
          python scripts/build_all.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Quarto with TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.36"
          tinytex: true

      - name: Install render dependencies
        # fonts-liberation is metric-compatible with Helvetica and Arial, so
        # figure labels wrap the same way as in the local Draw.io exports.
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin xvfb fonts-liberation

      - name: Install Draw.io CLI
        run: |
          drawio_deb_url="https://github.com/jgraph/drawio-desktop/releases/download/v29.6.6/drawio-amd64-29.6.6.deb"
          curl --fail --location --show-error --silent "${drawio_deb_url}" --output /tmp/drawio.deb
          sudo apt-get install --yes /tmp/drawio.deb

          drawio_path="$(command -v drawio || command -v draw.io || true)"
          if [ -z "${drawio_path}" ]; then
            echo "Draw.io installed, but no drawio executable was found on PATH"
            exit 1
          fi

          cat > /tmp/drawio-xvfb <<EOF
          #!/usr/bin/env bash
          exec xvfb-run -a "${drawio_path}" "\$@"
          EOF
          chmod +x /tmp/drawio-xvfb
          echo "DRAWIO_BIN=/tmp/drawio-xvfb" >> "${GITHUB_ENV}"

          sources=(visuals/src/*.drawio)
          smoke_source="${sources[0]}"
          if [ ! -f "${smoke_source}" ]; then
            echo "No Draw.io source file found for smoke test"
            exit 1
          fi
          /tmp/drawio-xvfb -x -f svg -o /tmp/drawio-smoke.svg "${smoke_source}"
          test -s /tmp/drawio-smoke.svg

      - name: Build book and chapter slides
        # Dataset-free. Every deck in slides/chapter-NN/index.qmd is rendered and published;
        # there is no approval step. Draw.io exports each cited figure as a PNG for PowerPoint.
        run: python scripts/build_all.py

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
