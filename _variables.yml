  # the same files (same SHA-256). Once it is published, switch both URLs to the pinned tag:
  #   release: https://github.com/mmcodesso/CharlesRiver_Database/releases/tag/v2026.1
  #   download: https://github.com/mmcodesso/CharlesRiver_Database/releases/download/v2026.1
  release: "https://github.com/mmcodesso/CharlesRiver_Database/releases/tag/v2026.1"
  download: "https://github.com/mmcodesso/CharlesRiver_Database/releases/download/v2026.1"
  sha256:
    sqlite: "de861968e07412d71032b6ed6a0fb8eb9825cf6911886b1597c4a628a914474c"
    xlsx: "185d42bd069fad177fae23c5e30df93edc7cf2669f687236c8a9f29435388e09"
    csv: "5f2821ee81f86c2da60702a9feaa51fa18f72687e5d0807c44a7d5489fecffb6"

