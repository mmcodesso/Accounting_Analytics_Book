# Values the book reads with {{< var key >}} shortcodes. Quarto loads this file for every page.
# The facts registry (Phase 3 of the companion-files and yearly-roll plan) will generate most keys;
# for now it holds the edition and the dataset release it is verified against.

edition: "2026"

dataset:
